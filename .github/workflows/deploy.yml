name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./CRUD MONGODB
          push: true
          tags: phamvantien/phone-be:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./learn-reactjs
          push: true
          tags: phamvantien/phone-fe:latest
          build-args: |
            REACT_APP_API_URL=
            REACT_APP_FRONTEND_URL=
            NODE_ENV=production
          # Note: Nếu cần custom API URL, có thể truyền qua secrets
          # build-args: |
          #   REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
          #   REACT_APP_FRONTEND_URL=${{ secrets.REACT_APP_FRONTEND_URL }}
          #   NODE_ENV=production

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (để lấy file docker-compose)
        uses: actions/checkout@v3

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/app"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            # Đảm bảo .env files tồn tại (nếu chưa có, tạo từ .env.example)
            if [ ! -f "CRUD MONGODB/.env" ]; then
              echo "⚠️  Backend .env file not found. Please create it manually on EC2."
            fi
            if [ ! -f "learn-reactjs/.env" ]; then
              echo "⚠️  Frontend .env file not found. Please create it manually on EC2."
            fi
            # Kéo image mới nhất về
            docker-compose pull
            # Chạy lại container (chỉ update cái nào thay đổi)
            docker-compose up -d --remove-orphans
            # Xóa image cũ cho đỡ rác
            docker image prune -f
            echo "✅ Deployment completed!"
