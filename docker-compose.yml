version: "3.8"
services:
  backend:
    image: phamvantien/phone-be:latest
    container_name: phone-backend
    restart: always
    environment:
      - DB_URL=mongodb://mongo-db:27017/crud_products
      - NODE_ENV=${NODE_ENV:-production}
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret-key}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - PORT=8080
    env_file:
      - ./CRUD MONGODB/.env
    depends_on:
      - mongo-db
    networks:
      - app-network

  frontend:
    image: phamvantien/phone-fe:latest
    container_name: phone-frontend
    restart: always
    ports:
      - "80:80" # Mở port 80 cho người dùng truy cập
    environment:
      # Nếu dùng Nginx proxy, để REACT_APP_API_URL trống
      # Nginx sẽ proxy /api sang backend
      - REACT_APP_API_URL=${REACT_APP_API_URL:-}
      - REACT_APP_FRONTEND_URL=${REACT_APP_FRONTEND_URL:-http://localhost}
    env_file:
      - ./learn-reactjs/.env
    depends_on:
      - backend
    networks:
      - app-network

  mongo-db:
    image: mongo:latest
    container_name: phone-mongo
    restart: always
    volumes:
      - mongo_data:/data/db # Lưu dữ liệu ra ổ cứng để không mất khi restart
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
